<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Pink circle background -->
  <circle cx="100" cy="100" r="100" fill="#B06070"/>
  <!-- Subtle inner glow -->
  <circle cx="100" cy="100" r="100" fill="url(#glow)" opacity="0.3"/>
  <defs>
    <radialGradient id="glow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Coffee dropper / syringe icon on B -->
  <g fill="white" opacity="0.95">
    <!-- Stylized B with coffee dropper stem -->
    <text x="34" y="120" font-family="Georgia, serif" font-size="62" font-weight="700" fill="white" letter-spacing="-1">B</text>
    <!-- Dropper needle on B -->
    <rect x="34" y="62" width="3" height="16" rx="1.5" fill="white" opacity="0.7"/>
    <ellipse cx="35.5" cy="60" rx="3" ry="4" fill="white" opacity="0.7"/>
    <!-- rown Dose text -->
    <text x="70" y="108" font-family="Georgia, serif" font-size="28" font-weight="400" fill="white" letter-spacing="0.5">rown</text>
    <text x="38" y="138" font-family="Georgia, serif" font-size="36" font-weight="700" fill="white" letter-spacing="1">Dose</text>
  </g>
</svg>
