<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050E1A"/>
      <stop offset="60%" stop-color="#0B3A5A"/>
      <stop offset="100%" stop-color="#050E1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B4A6F"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow circles -->
  <circle cx="200" cy="200" r="320" fill="#00B4D8" fill-opacity="0.05"/>
  <circle cx="1000" cy="430" r="280" fill="#0B4A6F" fill-opacity="0.08"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Logo shield -->
  <g transform="translate(100, 210)">
    <path d="M50 2L7 20V55C7 80 26 103 50 110C74 103 93 80 93 55V20L50 2Z" fill="url(#accent)"/>
    <path d="M50 8L14 24V55C14 77 30 97 50 104C70 97 86 77 86 55V24L50 8Z" fill="white" fill-opacity="0.08"/>
    <text x="50" y="68" text-anchor="middle" fill="white" font-size="42" font-weight="800" font-family="Tajawal,Arial,sans-serif">ت</text>
  </g>

  <!-- Brand name -->
  <text x="225" y="252" fill="white" font-size="52" font-weight="900" font-family="Tajawal,Arial,sans-serif" text-anchor="start">تلقا للعيادات</text>
  <text x="225" y="295" fill="#00B4D8" font-size="22" font-weight="500" font-family="Tajawal,Arial,sans-serif" text-anchor="start">Tlga Clinics — tlgaads.com</text>

  <!-- Divider -->
  <rect x="100" y="325" width="500" height="2" fill="url(#accent)" opacity="0.6"/>

  <!-- Main headline -->
  <text x="100" y="400" fill="white" font-size="46" font-weight="900" font-family="Tajawal,Arial,sans-serif" text-anchor="start">موقعك وتطبيقك الطبي</text>
  <text x="100" y="460" fill="white" font-size="46" font-weight="900" font-family="Tajawal,Arial,sans-serif" text-anchor="start">في <tspan fill="#00B4D8">٦٠ يوم</tspan> فقط</text>

  <!-- Sub text -->
  <text x="100" y="515" fill="rgba(255,255,255,0.55)" font-size="22" font-weight="400" font-family="Tajawal,Arial,sans-serif" text-anchor="start">حجز مواعيد · تطبيق مريض · لوحة تحكم · Apple Wallet</text>

  <!-- Right side — feature pills -->
  <g transform="translate(720, 180)">
    <!-- Phone mockup outline -->
    <rect x="0" y="0" width="220" height="420" rx="32" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="80" y="10" width="60" height="16" rx="8" fill="rgba(0,0,0,0.6)"/>

    <!-- Screen content -->
    <rect x="16" y="40" width="188" height="60" rx="14" fill="url(#accent)" fill-opacity="0.25" stroke="rgba(0,180,216,0.3)" stroke-width="1"/>
    <text x="110" y="65" text-anchor="middle" fill="white" font-size="11" font-weight="700" font-family="Tajawal,Arial,sans-serif">بطاقة مريض رقمية</text>
    <text x="110" y="85" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10" font-family="Tajawal,Arial,sans-serif">Apple Wallet · QR فوري</text>

    <rect x="16" y="112" width="88" height="80" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="60" y="148" text-anchor="middle" fill="white" font-size="22">📅</text>
    <text x="60" y="168" text-anchor="middle" fill="white" font-size="10" font-weight="700" font-family="Tajawal,Arial,sans-serif">حجز مواعيد</text>
    <text x="60" y="183" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="9" font-family="Tajawal,Arial,sans-serif">٢٤/٧</text>

    <rect x="116" y="112" width="88" height="80" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="160" y="148" text-anchor="middle" fill="white" font-size="22">🔬</text>
    <text x="160" y="168" text-anchor="middle" fill="white" font-size="10" font-weight="700" font-family="Tajawal,Arial,sans-serif">نتائج التحاليل</text>
    <text x="160" y="183" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="9" font-family="Tajawal,Arial,sans-serif">فورية</text>

    <rect x="16" y="204" width="188" height="56" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="110" y="228" text-anchor="middle" fill="white" font-size="18">🤖</text>
    <text x="110" y="248" text-anchor="middle" fill="white" font-size="10" font-weight="700" font-family="Tajawal,Arial,sans-serif">AI Doctor — تحليل أعراض</text>

    <rect x="16" y="272" width="188" height="44" rx="12" fill="url(#accent)" fill-opacity="0.9"/>
    <text x="110" y="299" text-anchor="middle" fill="white" font-size="13" font-weight="800" font-family="Tajawal,Arial,sans-serif">احجز موعدك الآن →</text>

    <!-- Home bar -->
    <rect x="75" y="404" width="70" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>
  </g>

  <!-- Stats row -->
  <g transform="translate(720, 50)">
    <rect x="0" y="0" width="130" height="70" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="65" y="32" text-anchor="middle" fill="#00B4D8" font-size="24" font-weight="900" font-family="Tajawal,Arial,sans-serif">٦٢٪</text>
    <text x="65" y="52" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11" font-family="Tajawal,Arial,sans-serif">تقليص وقت الانتظار</text>

    <rect x="148" y="0" width="130" height="70" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="213" y="32" text-anchor="middle" fill="#10B981" font-size="24" font-weight="900" font-family="Tajawal,Arial,sans-serif">٨٩٪</text>
    <text x="213" y="52" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11" font-family="Tajawal,Arial,sans-serif">رضا المرضى</text>

    <rect x="296" y="0" width="130" height="70" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="361" y="32" text-anchor="middle" fill="#F59E0B" font-size="24" font-weight="900" font-family="Tajawal,Arial,sans-serif">٦٠</text>
    <text x="361" y="52" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11" font-family="Tajawal,Arial,sans-serif">يوم للتسليم</text>
  </g>
</svg>
